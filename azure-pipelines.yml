trigger:
- main

pool:
  name: dhurander

stages:
- stage: scan
  displayName: 'scantool'

  jobs:
  - job: checkov
    displayName: 'checkov'

    steps:

    # Terraform Install
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'checkov -d'
    - task: CmdLine@1
      inputs:
        filename: 'tflint'
         
- stage: TerraformPlan
  displayName: 'Terraform Init Validate Plan'

  jobs:
  - job: Terraform
    displayName: 'Terraform'

    steps:

    # Terraform Install
    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.13.4'
      inputs:
        terraformVersion: '1.13.4'

    # Verify Terraform
    - powershell: |
        terraform version
        where.exe terraform
      displayName: 'Verify Terraform'

    # INIT
    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'data'
        backendAzureRmResourceGroupName: 'rg-statefile'
        backendAzureRmStorageAccountName: 'stagefile123321'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'

    # VALIDATE
    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

    # PLAN
    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        environmentServiceNameAzureRM: 'data'
