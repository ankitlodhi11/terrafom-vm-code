trigger:
- main

pool:
  name: dhurander

stages:

- stage: Terraform
  displayName: 'Terraform'
  jobs:

  - job: Terraform
    displayName: 'Terraform Init Plan'

    steps:

    - task: TerraformInstaller@1
      displayName: 'Install Terraform 1.13.4'
      inputs:
        terraformVersion: '1.13.4'

    - powershell: |
        terraform version
        where.exe terraform
      displayName: 'Verify Terraform'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'data'
        backendAzureRmResourceGroupName: 'rg-statefile'
        backendAzureRmStorageAccountName: 'stagefile123321'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        environmentServiceNameAzureRM: 'data'